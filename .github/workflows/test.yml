name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test server startup
        run: |
          # Test that server can start without errors
          timeout 10 npm start &
          SERVER_PID=$!
          sleep 5
          if curl -f http://localhost:3000/health; then
            echo "✅ Server started successfully"
            kill $SERVER_PID 2>/dev/null || true
          else
            echo "❌ Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: |
          # Basic file structure validation
          echo "Checking project structure..."
          test -f backend/server.js || (echo "❌ Missing backend/server.js" && exit 1)
          test -f backend/database/index.js || (echo "❌ Missing backend/database/index.js" && exit 1)
          test -f frontend/public/index.html || (echo "❌ Missing frontend/public/index.html" && exit 1)
          echo "✅ Project structure looks good"

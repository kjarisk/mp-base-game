<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Combat - Welcome</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <img src="./img/spaceship-logo.svg" alt="Game Logo" class="logo">
      <h2>Stellar Combat</h2>
      
      <!-- Tab Navigation -->
      <div class="tab-container">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>
      
      <!-- Login Form -->
      <div id="loginTab" class="tab-content active">
        <form id="loginForm">
          <input name="username" type="text" placeholder="Username" required />
          <input name="password" type="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
      </div>
      
      <!-- Register Form -->
      <div id="registerTab" class="tab-content">
        <form id="registerForm">
          <input name="username" type="text" placeholder="New username" required />
          <input name="password" type="password" placeholder="New password" required />
          <button type="submit">Register</button>
        </form>
      </div>
      
      <!-- Divider -->
      <div class="divider">or</div>
      
      <!-- Guest Button -->
      <button id="guestBtn" class="guest-btn">Continue as Guest</button>
    </div>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>

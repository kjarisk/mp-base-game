<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Page - Stellar Combat</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 240, 0.1) 0%, transparent 50%);
            color: var(--accent-color);
            min-height: 100vh;
        }
        
        .debug-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }
        
        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--shadow-primary);
            margin-bottom: 10px;
        }
        
        .debug-info {
            background: var(--bg-overlay);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .success {
            color: var(--primary-color);
            font-weight: bold;
            text-shadow: 0 0 5px var(--shadow-primary);
        }
        
        .error {
            color: var(--secondary-color);
            font-weight: bold;
            text-shadow: 0 0 5px var(--shadow-secondary);
        }
        
        button {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: var(--bg-color);
            font-weight: 600;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--shadow-primary);
        }
        
        pre {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--accent-color);
            font-family: 'Courier New', monospace;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="debug-header">
        <img src="./img/spaceship-logo.svg" alt="Game Logo" class="logo">
        <h1>🔧 Stellar Combat Debug</h1>
    </div>
    
    <div class="debug-info">
        <p class="success">✅ If you can see this page, the server is working!</p>
        <p><strong>Server Status:</strong> <span id="server-status">Running</span></p>
        <p><strong>Current URL:</strong> <span id="current-url"></span></p>
        <p><strong>Time:</strong> <span id="current-time"></span></p>
        
        <h3 style="color: var(--primary-color); margin: 20px 0 15px 0;">Quick Tests:</h3>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <button onclick="testMainPage()">Test Main Page</button>
        <button onclick="goToMainGame()">Go to Main Game</button>
        
        <div id="test-results" style="margin-top: 20px;"></div>
    </div>

    <script>
        // Update current info
        document.getElementById('current-url').textContent = window.location.href;
        document.getElementById('current-time').textContent = new Date().toLocaleString();

        async function testHealth() {
            const results = document.getElementById('test-results');
            try {
                const response = await fetch('/health');
                const data = await response.json();
                results.innerHTML = `<div class="success">✅ Health Check: ${JSON.stringify(data, null, 2)}</div>`;
            } catch (error) {
                results.innerHTML = `<div class="error">❌ Health Check Failed: ${error.message}</div>`;
            }
        }

        async function testMainPage() {
            const results = document.getElementById('test-results');
            try {
                const response = await fetch('/');
                const html = await response.text();
                results.innerHTML = `<div class="success">✅ Main Page Loaded (${html.length} characters)</div>`;
            } catch (error) {
                results.innerHTML = `<div class="error">❌ Main Page Failed: ${error.message}</div>`;
            }
        }

        function goToMainGame() {
            window.location.href = '/';
        }
    </script>
</body>
</html>

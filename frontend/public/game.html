<html>
  <head>
    <title>Stellar Combat - Game</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        margin: 0;
        background: var(--bg-color);
        background-image: 
          radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 0, 240, 0.1) 0%, transparent 50%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      canvas {
        width: 1024px;
        height: 576px;
        background: var(--bg-color);
        border: 2px solid var(--primary-color);
        box-shadow: 0 0 30px var(--shadow-primary);
        border-radius: 8px;
      }

      .leaderboard {
        position: absolute;
        color: var(--accent-color);
        padding: 15px;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        user-select: none;
        background: var(--bg-overlay);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        top: 20px;
        left: 20px;
        min-width: 200px;
      }

      .leaderboard-title {
        margin-bottom: 10px;
        color: var(--primary-color);
        font-weight: bold;
        text-shadow: 0 0 10px var(--shadow-primary);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="leaderboard">
        <div class="leaderboard-title">Leaderboard</div>
        <div id="playerLabels"></div>
      </div>
      <canvas></canvas>
      <!-- username input -->
      <div></div>
    </div>
    <!-- username input end -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/gsap.min.js"
      integrity="sha512-kVlGhj2qFy+KBCFuvjBJTGUMxbdqJKs4yK2jh0e0VPhWUPiPC87bzm4THmaaIee3Oj7j6sDpTTgm2EPPiESqBg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script src="./js/classes/Enemy.js"></script>
    <script src="./js/classes/Player.js"></script>
    <script src="./js/classes/Particle.js"></script>
    <script src="./js/classes/Projectile.js"></script>

    <script src="./js/sanitizeHtml.js"></script>

    <script src="./js/frontend.js"></script>
    <script src="./js/eventListeners.js"></script>
  </body>
</html>

<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Main hull -->
  <path d="M20 2 L32 24 L28 30 L24 28 L20 35 L16 28 L12 30 L8 24 Z" 
        fill="#2a3a5c" stroke="#1a2a4c" stroke-width="1"/>
  
  <!-- Cockpit windows -->
  <ellipse cx="20" cy="12" rx="3" ry="5" fill="#00ccff" opacity="0.8"/>
  <ellipse cx="20" cy="18" rx="2" ry="3" fill="#00ccff" opacity="0.6"/>
  
  <!-- Side wings -->
  <path d="M8 24 L4 26 L6 32 L12 30 Z" fill="#3a4a6c" stroke="#2a3a5c" stroke-width="1"/>
  <path d="M32 24 L36 26 L34 32 L28 30 Z" fill="#3a4a6c" stroke="#2a3a5c" stroke-width="1"/>
  
  <!-- Engine exhausts -->
  <circle cx="16" cy="32" r="2" fill="#ff6600"/>
  <circle cx="24" cy="32" r="2" fill="#ff6600"/>
  
  <!-- Engine glow (will be colored) -->
  <ellipse cx="20" cy="36" rx="4" ry="2" fill="#00ffff" opacity="0.6"/>
  
  <!-- Central engine -->
  <rect x="18" y="28" width="4" height="8" rx="2" fill="#4a5a7c"/>
  
  <!-- Detail lines -->
  <line x1="20" y1="8" x2="20" y2="22" stroke="#00ccff" stroke-width="1" opacity="0.4"/>
  <line x1="14" y1="20" x2="26" y2="20" stroke="#00ccff" stroke-width="1" opacity="0.3"/>
  
  <!-- Weapon hardpoints (nose) -->
  <circle cx="18" cy="6" r="1" fill="#ff3366"/>
  <circle cx="22" cy="6" r="1" fill="#ff3366"/>
</svg>
